<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nook Tours System</title>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Readex Pro', Arial, sans-serif;
      color: #e6ebf2;
      background: #0a1421;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px 32px;
      border-radius: 20px;
      text-align: center;
      background: #111d2e;
      border: 1px solid #1f2d42;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c98b4d;
      display: block;
      margin: 0 auto 18px;
    }
    .brand {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c98b4d;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
      color: #f2f5f9;
    }
    .desc {
      margin: 0 0 28px;
      font-size: 14px;
      line-height: 1.8;
      color: #8fa0b8;
    }
    .btn {
      display: block;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      color: #0a1421;
      background: #c98b4d;
      transition: background .2s, transform .2s;
    }
    .btn:hover {
      background: #d89c5f;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="2026_06_25_13_00_46_IMG_8017.jpg" alt="Nook Tours">
    <p class="brand">Nook Tours</p>
    <h1>Nook Tours System</h1>
    <p class="desc">سجّل دخولك بحسابك المعتمد للوصول إلى البيانات.</p>
    <a class="btn" href="https://docs.google.com/spreadsheets/d/1itrqY9fMibmtDPJB5ALVljKZrmMmm8wenEeJMQxh_No/edit?usp=sharing">دخول</a>
  </main>
</body>
</html>
