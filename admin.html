<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1320">
<title>لوحة تحكم Nook Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--navy:#0a2a4a;--navy2:#123a5e;--navy3:#1f5687;--gold:#c9a06a;--gold2:#e0bb85;--gold3:rgba(201,160,106,.14);--bg:#0a1320;--card:#111e2f;--card2:#16263a;--thumb:#1c2f47;--ink:#e6edf5;--mut:#93a5b9;--line:#24384f;--ok:#3fa877;--ok2:rgba(63,168,119,.16);--err:#e0675b;--err2:rgba(224,103,91,.16);--wait:#e8b86a;--wait2:rgba(232,184,106,.16);--r:16px;--r-sm:12px;--sp:16px;--side:248px;--shadow:0 6px 18px rgba(0,0,0,.35);--shadow-lg:0 30px 80px rgba(0,0,0,.6)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Readex Pro",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
/* ---------- layout ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) var(--sp) 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top b{font-size:1.05rem;letter-spacing:.02em}header.top b span{color:var(--gold)}
.hbtns{display:flex;gap:8px}
.hbtns a,.hbtns button{color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s}
.hbtns a:hover,.hbtns button:hover{background:rgba(255,255,255,.22)}
.hbtns a,.hbtns button{white-space:nowrap}
header.top b{white-space:nowrap}header.top b small{font-size:inherit;font-weight:inherit}
@media(max-width:420px){.hide-sm{display:none}}
@media(max-width:420px){header.top b{font-size:.9rem}.hbtns{gap:6px}.hbtns a,.hbtns button{padding:6px 10px;font-size:13px}}
main{max-width:1080px;margin:0 auto;padding:var(--sp)}
h2{margin:6px 0 14px;font-size:1.25rem}
nav.side{display:none}
nav.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--card2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar button{border:0;background:none;padding:10px 4px 8px;font-size:11px;color:var(--mut);cursor:pointer;position:relative}
nav.bar button span{display:block;font-size:22px;line-height:1.2}nav.bar button.on{color:var(--gold);font-weight:700}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 8px);background:var(--err);color:#fff;border-radius:999px;font-size:11px;font-style:normal;padding:0 6px;line-height:1.6}
@media(min-width:900px){
  body{padding-bottom:0}
  nav.bar{display:none}
  nav.side{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--side);background:var(--navy);color:#fff;padding:22px 14px;z-index:25}
  nav.side .brand{font-weight:700;font-size:1.2rem;padding:4px 12px 18px}nav.side .brand span{color:var(--gold)}
  nav.side button{display:flex;align-items:center;gap:10px;border:0;background:none;color:rgba(255,255,255,.78);text-align:start;padding:11px 12px;border-radius:12px;cursor:pointer;position:relative;transition:background .2s,color .2s}
  nav.side button:hover{background:rgba(255,255,255,.08);color:#fff}
  nav.side button.on{background:var(--gold);color:var(--navy);font-weight:700}
  nav.side .badge{position:static;margin-inline-start:auto}
  #app{padding-inline-start:var(--side)}
  header.top{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
  header.top b{visibility:hidden}
  .hbtns a,.hbtns button{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .hbtns a:hover,.hbtns button:hover{background:var(--gold3)}
  #toast{inset-inline-start:calc(var(--side) + 16px);bottom:24px}
}
/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border:1px solid transparent;border-radius:999px;font-weight:600;cursor:pointer;background:var(--navy3);color:#fff;text-decoration:none;transition:transform .15s,opacity .15s,background .2s}
.btn:hover{background:#2a6497}.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.gold:hover{background:#d0a76f}
.btn.ghost{background:var(--card2);border-color:var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--gold3)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--err)}.btn.wa{background:#1f8f4e}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.55;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid2{display:grid;gap:12px}
@media(min-width:900px){.grid2{grid-template-columns:3fr 2fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{border:1px solid var(--line);background:var(--card2);border-radius:var(--r);padding:14px;text-align:start;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,18,32,.1)}
.kpi b{display:block;font-size:2rem;line-height:1.1;color:var(--ink)}.kpi small{color:var(--mut)}
.kpi.hot{background:linear-gradient(160deg,var(--card),var(--err2))}.kpi.hot b{color:var(--err)}
.kpi.lead{background:linear-gradient(160deg,var(--navy),var(--navy3));color:#fff;border:0}.kpi.lead b{color:var(--gold)}.kpi.lead small{color:rgba(255,255,255,.75)}
.chart{display:grid;grid-template-columns:repeat(14,1fr);align-items:end;gap:6px;height:140px;padding-top:10px}
.chart div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.chart i{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(#3a78b0,var(--navy3));min-height:3px}
.chart div.today i{background:linear-gradient(var(--gold2),var(--gold))}.chart div.today{color:var(--gold2);font-weight:700}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}
.bar-h{height:8px;border-radius:999px;background:var(--gold3);overflow:hidden;margin-top:4px}.bar-h i{display:block;height:100%;background:var(--gold)}
.row{display:flex;gap:12px;align-items:flex-start}.row>div{flex:1;min-width:0}
.thumb{width:76px;height:76px;border-radius:var(--r-sm);object-fit:cover;background:var(--thumb);flex:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--thumb);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok2);color:var(--ok)}.pill.bad{background:var(--err2);color:var(--err)}.pill.wait{background:var(--wait2);color:var(--wait)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 16px;cursor:pointer}
.filters button.on{background:var(--navy3);color:#fff;border-color:var(--navy3)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--navy3);color:#fff;font-weight:600}
.stars{color:var(--gold);letter-spacing:2px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gal .card{padding:8px;margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--thumb)}
@media(min-width:700px){.gal{grid-template-columns:repeat(4,1fr)}}
.bk-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bk-meta{color:var(--mut);font-size:13px;margin:2px 0 8px}
.bk-grid{display:grid;grid-template-columns:1fr;gap:4px 14px;font-size:14px}
@media(min-width:700px){.bk-grid{grid-template-columns:1fr 1fr}}
.bk-note{margin:8px 0 0;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px}
.field{margin-bottom:14px}.field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card2)}
textarea{min-height:110px;resize:vertical}
input.search{border-radius:999px;padding:10px 16px;margin-bottom:10px}
.imgbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.imgbox img{width:96px;height:72px;object-fit:cover;border-radius:10px;background:var(--thumb)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.tog input{width:26px;height:26px;accent-color:var(--gold);flex:none}
details.sec summary,details.help summary{font-weight:700;font-size:1.02rem;cursor:pointer;padding:4px 0}details.sec[open] summary{margin-bottom:8px}
details.help ol{margin:10px 0 0;padding-inline-start:20px}details.help li{margin-bottom:8px}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 20px));max-height:92vh;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(5,10,18,.6)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700}.db{padding:18px;overflow:auto;max-height:64vh}.df{padding:14px 18px;display:flex;gap:10px;border-top:1px solid var(--line)}.df .btn{flex:1}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy),var(--navy2))}
#login .card{width:min(380px,100%);text-align:center;padding:26px}#login h1{margin:0 0 4px;color:var(--ink)}#login h1 span{color:var(--gold2)}
#toast{position:fixed;inset-inline:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--navy3);color:#fff;border-radius:14px;padding:12px 16px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;max-width:520px;margin-inline:auto}
#toast.on{opacity:1}#toast.bad{background:var(--err)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.more{display:block;margin:6px auto 0}
dialog{background:var(--card);color:var(--ink)}
.kpi.hot b{color:var(--err)}
nav.side{background:#08192b;border-inline-end:1px solid var(--line)}
.btn.ghost:hover{background:var(--gold3)}
::placeholder{color:#6f8399}
</style>
</head>
<body>
<section id="login">
  <div class="card">
    <h1>Nook <span>Tours</span></h1>
    <p class="hint" style="margin:0 0 18px">لوحة التحكم — للإدارة فقط</p>
    <div class="field"><label for="pw" class="hide">كلمة السر</label><input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر"></div>
    <button class="btn" id="go" style="width:100%">دخول</button>
    <p id="lerr" class="hint" style="color:var(--err);min-height:1.4em" role="alert"></p>
  </div>
</section>

<div id="app" class="hide">
  <nav class="side" id="side" aria-label="أقسام لوحة التحكم">
    <div class="brand">Nook <span>Tours</span></div>
    <button data-tab="home">🏠 الرئيسية</button>
    <button data-tab="bookings">📋 الحجوزات<i class="badge hide" data-badge="bookings"></i></button>
    <button data-tab="reviews">⭐ الآراء<i class="badge hide" data-badge="reviews"></i></button>
    <button data-tab="offers">🧭 العروض</button>
    <button data-tab="hotels">🏨 الفنادق والأسعار</button>
    <button data-tab="gallery">🖼️ الصور</button>
    <button data-tab="settings">⚙️ الإعدادات</button>
  </nav>
  <header class="top"><b>Nook <span>Tours</span><small class="hide-sm"> · الإدارة</small></b><span class="hbtns"><button id="refresh" type="button" aria-label="تحديث البيانات">↻ تحديث</button><a href="index.html" target="_blank" rel="noopener">الموقع</a><button id="out" type="button">خروج</button></span></header>
  <main id="view"></main>
  <nav class="bar" id="bar" aria-label="أقسام لوحة التحكم">
    <button data-tab="home"><span>🏠</span>الرئيسية</button>
    <button data-tab="bookings"><span>📋</span>الحجوزات<i class="badge hide" data-badge="bookings"></i></button>
    <button data-tab="reviews"><span>⭐</span>الآراء<i class="badge hide" data-badge="reviews"></i></button>
    <button data-tab="offers" data-group="content"><span>🗂️</span>المحتوى</button>
    <button data-tab="settings"><span>⚙️</span>الإعدادات</button>
  </nav>
</div>

<dialog id="dlg"><div class="dh" id="dt"></div><div class="db" id="dbody"></div><div class="df"><button class="btn ghost" id="dc" type="button">إلغاء</button><button class="btn gold" id="ds" type="button">حفظ</button></div></dialog>
<input type="file" id="fileOne" accept="image/*" class="hide"><input type="file" id="fileMany" accept="image/*" multiple class="hide">
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ======================= config ======================= */
var API="https://script.google.com/macros/s/AKfycbymH-1FG-gyN9-l0jlZ4HJquCIYP52faFg-m89SjtrtYtfmPUXQtSkmgzNCYpg2SG5F/exec"; // dashboard (CMS) script
var SITE_CACHE_KEY="nt-cms-v3";           // index.html cache — cleared after every save so the site shows changes at once
var WRITE_OPS=["save","save_many","delete","status","approve_all","config_save"];
var PAGE=30, CHART_DAYS=14, IMG_MAX=1400, IMG_Q=.82;
var DESTS=[["dahab","دهب"],["sokhna","العين السخنة"],["hurghada","الغردقة"],["siwa","سيوة"],["marsa_matrouh","مرسى مطروح"],["alexandria","الإسكندرية"],["sharm","شرم الشيخ"],["luxor","الأقصر"],["aswan","أسوان"]];
var DEST_NAME={};DESTS.forEach(function(d){DEST_NAME[d[0]]=d[1]});
var ERR={auth:"كلمة السر غير صحيحة",locked:"محاولات كثيرة، جرّب بعد نصف ساعة",noadmin:"لم يتم ضبط ADMIN_PASS في خصائص السكريبت بعد",invalid:"البيانات ناقصة أو غير صالحة",not_found:"العنصر غير موجود — اضغط تحديث",too_big:"الصورة كبيرة جداً",bad_phone:"رقم الواتساب غير صحيح (10 أرقام على الأقل)",bad_ig:"رابط الانستجرام غير صحيح (يبدأ بـ https://instagram.com/)",weak:"كلمة السر قصيرة (8 أحرف على الأقل)",bad_type:"نوع الملف غير مدعوم",server:"خطأ في السكريبت، حاول مرة أخرى",unknown_action:"السكريبت قديم — انشر نسخة Code_CMS.gs الجديدة",bad_op:"السكريبت قديم — انشر نسخة Code_CMS.gs الجديدة",
  no_bookings:"لسه ما اتربطش شيت الحجوزات: ضيف BOOKINGS_SHEET_ID في خصائص سكريبت الـ CMS",bookings_access:"سكريبت الـ CMS مش قادر يفتح شيت الحجوزات — راجع الـ ID والصلاحيات"};

/* ======================= state ======================= */
var pass=sessionStorage.getItem("nk")||"";
var D={reviews:[],offers:[],gallery:[],hotels:[],config:{},bookings:[]};
var tab="home",rf="all",rq="",bf="new",bq="",bLimit=PAGE,hReg="all",cur=null;

/* ======================= helpers ======================= */
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m,bad){var t=$("toast");t.textContent=m;t.className="on"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=""},2800)}
function fail(j){toast(ERR[j&&j.error]||"حدث خطأ، حاول مرة أخرى",1)}
/* 0 = already reported by fail(); anything else is a network/script error */
function oops(e){if(e===0)return;console.error("[admin]",e);toast("تعذّر الاتصال بالسكريبت، حاول مرة أخرى",1)}
function api(b){b.action="admin";b.pass=pass;
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(j){if(j&&j.ok&&WRITE_OPS.indexOf(b.op)>=0){try{localStorage.removeItem(SITE_CACHE_KEY)}catch(e){}}if(j&&j.error==="auth"&&b.op!=="bootstrap")logout();return j})}
function key(x){return +x.sort||+x.id||0}
function sorted(t){return D[t].slice().sort(function(a,b){return key(a)-key(b)})}
function isOn(x){var v=String(x.active).toLowerCase();return v===""||v==="1"||v==="true"}
function stars(n){n=Math.min(5,Math.max(1,+n||5));return"★".repeat(n)+"☆".repeat(5-n)}
function find(t,id){return D[t].filter(function(x){return String(x.id)===String(id)})[0]}
function isBooked(b){return String(b.booked).trim()==="نعم"}
function dayOf(s){var m=String(s||"").match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function intlPhone(p){var d=String(p||"").replace(/\D/g,"");if(/^0\d{10}$/.test(d))return"20"+d.slice(1);if(/^1\d{9}$/.test(d))return"20"+d;return d}
function money(v){var n=+String(v||"").replace(/[^\d.]/g,"");return n?n.toLocaleString("ar-EG")+" ج":"—"}

/* ======================= data ======================= */
function applyBoot(j){["reviews","offers","gallery","hotels","bookings"].forEach(function(k){D[k]=Array.isArray(j[k])?j[k]:[]});D.config=j.config||{};D.bookingsErr=j.bookings_error||""}
function loadAll(){return api({op:"bootstrap"}).then(function(j){if(!j.ok){fail(j);if(j.error==="auth")logout();return}applyBoot(j);render()}).catch(oops)}
function load(t){return api({op:"list",type:t}).then(function(j){if(j.ok)D[t]=j.items;else fail(j)})}

/* ======================= login ======================= */
function enter(){$("login").classList.add("hide");$("app").classList.remove("hide");render()}
function logout(){pass="";sessionStorage.removeItem("nk");$("app").classList.add("hide");$("login").classList.remove("hide")}
$("go").onclick=function(){var p=$("pw").value.trim();if(!p)return;$("go").disabled=!0;$("lerr").textContent="";pass=p;
  api({op:"bootstrap"}).then(function(j){$("go").disabled=!1;if(j.ok){sessionStorage.setItem("nk",p);applyBoot(j);enter()}else{pass="";$("lerr").textContent=ERR[j.error]||"تعذّر الدخول"}})
  .catch(function(e){console.error("[admin] login",e);$("go").disabled=!1;pass="";$("lerr").textContent="تعذّر الاتصال بالسكريبت"})};
$("pw").addEventListener("keydown",function(e){e.key==="Enter"&&$("go").click()});
$("out").onclick=logout;
$("refresh").onclick=function(){var b=this;b.disabled=!0;loadAll().then(function(){b.disabled=!1;toast("تم التحديث ✓")})};
function navClick(e){var b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;bLimit=PAGE;render();window.scrollTo(0,0)}}
$("side").onclick=navClick;$("bar").onclick=navClick;

/* ======================= render ======================= */
var CONTENT_TABS=["offers","hotels","gallery"];
function setNav(){
  var pendR=D.reviews.filter(function(r){return r.status==="pending"}).length,newB=D.bookings.filter(function(b){return!isBooked(b)}).length;
  [].forEach.call(document.querySelectorAll("nav [data-tab]"),function(b){var on=b.dataset.tab===tab||(b.dataset.group==="content"&&CONTENT_TABS.indexOf(tab)>=0);b.classList.toggle("on",on);on?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  [].forEach.call(document.querySelectorAll("[data-badge]"),function(i){var n=i.dataset.badge==="reviews"?pendR:newB;i.textContent=n;i.classList.toggle("hide",!n)});
}

   '<button class="btn gold" data-savecfg="1" style="width:100%;margin:4px 0 14px">حفظ كل الإعدادات</button>'+
   sec("🔐 الأمان",'<div class="field"><label for="np1">كلمة السر الجديدة (8 أحرف على الأقل)</label><input id="np1" type="password" autocomplete="new-password"></div><div class="field"><label for="np2">تأكيد كلمة السر</label><input id="np2" type="password" autocomplete="new-password"></div><button class="btn" data-setpass="1">تغيير كلمة السر</button>')+
   sec("💾 نسخة احتياطية",'<p class="hint">نزّل نسخة CSV تفتحها في إكسل أو جوجل شيت.</p><div class="acts"><button class="btn ghost sm" data-csv="bookings">الحجوزات</button><button class="btn ghost sm" data-csv="reviews">الآراء</button><button class="btn ghost sm" data-csv="offers">العروض</button><button class="btn ghost sm" data-csv="hotels">الفنادق</button><button class="btn ghost sm" data-csv="gallery">الصور</button></div>');
}
function exportCsv(t){var L=D[t]||[];if(!L.length){toast("مفيش بيانات للتصدير",1);return}
  var cols=Object.keys(L[0]);var q=function(x){x=String(x==null?"":x);if(/^[=+\-@]/.test(x))x="'"+x;return'"'+x.replace(/"/g,'""')+'"'};
  var csv="﻿"+cols.join(",")+"\r\n"+L.map(function(r){return cols.map(function(c){return q(r[c])}).join(",")}).join("\r\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="nook-"+t+"-"+ymd(new Date())+".csv";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast("تم تنزيل الملف ✓")}
function saveCfg(){var g=function(i){return $(i).value.trim()},c=function(i){return $(i).checked?"1":"0"};
  var hide=[].filter.call(document.querySelectorAll(".dchk"),function(x){return!x.checked}).map(function(x){return x.dataset.k}).join(",");
  var dimgs={};[].forEach.call(document.querySelectorAll(".dimg-url"),function(inp){var v=inp.value.trim();if(v)dimgs[inp.dataset.k]=v});
  var cfg={ann_active:c("c_ann_active"),ann_ar:g("c_ann_ar"),ann_en:g("c_ann_en"),ann_link:g("c_ann_link"),stat_hotels:g("c_stat_hotels"),stat_dests:g("c_stat_dests"),dest_hide:hide,dest_imgs:JSON.stringify(dimgs),
    about_ar:g("c_about_ar"),about_en:g("c_about_en"),phone_display:g("c_phone_display"),address_ar:g("c_address_ar"),address_en:g("c_address_en"),
    whatsapp:g("c_whatsapp")||"201005377933",instagram:g("c_instagram"),show_offers:c("c_show_offers"),show_gallery:c("c_show_gallery"),show_reviews:c("c_show_reviews"),show_founder:c("c_show_founder")};
  api({op:"config_save",config:cfg}).then(function(j){if(j.ok){D.config=j.config||cfg;toast("تم الحفظ — ظاهر في الموقع ✓")}else fail(j)}).catch(oops)}
function setPass(){var a=$("np1").value,b=$("np2").value;if(a.length<8)return toast(ERR.weak,1);if(a!==b)return toast("كلمتا السر غير متطابقتين",1);
  api({op:"set_pass",newpass:a}).then(function(j){if(j.ok){pass=a;sessionStorage.setItem("nk",a);$("np1").value=$("np2").value="";toast("تم تغيير كلمة السر ✓")}else fail(j)}).catch(oops)}

/* ======================= actions ======================= */
function save(t,item,quiet){return api({op:"save",type:t,item:item}).then(function(j){if(!j.ok){fail(j);throw 0}if(!quiet)toast("تم الحفظ ✓");return j})}
function setBooking(btn,d){btn.disabled=!0;
  api({op:"booking_status",row:d.row,order:d.order,booked:d.bk}).then(function(j){if(!j.ok){fail(j);btn.disabled=!1;return}
    D.bookings.forEach(function(b){if(String(b.row)===String(d.row))b.booked=j.booked});render();toast(j.booked==="نعم"?"تم تأكيد الحجز ✓":"تم إلغاء التأكيد")}).catch(function(e){btn.disabled=!1;oops(e)})}
function importHotels(btn){btn.disabled=!0;toast("جاري قراءة الفنادق من الموقع...");
  var f=document.createElement("iframe");f.style.display="none";f.src="index.html";
  var done=function(err,items){f.remove();if(err){btn.disabled=!1;console.error("[admin] import",err);toast("تعذّر قراءة الفنادق — افتح اللوحة من نفس موقعك (مش من ملف على الجهاز)",1);return}
    api({op:"save_many",type:"hotels",items:items}).then(function(j){if(!j.ok){fail(j);btn.disabled=!1;return}toast("تم استيراد "+j.n+" فندق ✓");return load("hotels").then(render)}).catch(function(e){btn.disabled=!1;oops(e)})};
  var norm=function(s){return String(s||"").replace(/\s+/g," ").trim().toLowerCase()};
  var have={};D.hotels.forEach(function(h){have[norm(h.name_ar)]=1;have[norm(h.name_en)]=1});delete have[""];
  var base=D.hotels.reduce(function(m,h){return Math.max(m,+h.sort||0)},0);
  f.onload=function(){try{var H=f.contentWindow.H;if(!Array.isArray(H)||!H.length)throw new Error("H not found");
    var items=H.filter(function(h){return h&&h.ar&&h.r&&!have[norm(h.ar)]&&!have[norm(h.en)]}).map(function(h,i){return{name_ar:h.ar,name_en:h.en||"",region:h.r,price_stay:h.pa||"",price_day:h.pe||"",img:h.img||"",video:h.vid||"",active:"1",sort:base+i+1}});
    if(!items.length){f.remove();btn.disabled=!1;toast("كل فنادق الموقع موجودة بالفعل ✓");return}
    done(null,items)}catch(e){done(e)}};
  f.onerror=function(e){done(e||new Error("iframe"))};document.body.appendChild(f)}
$("view").onclick=function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.go){tab=d.go;if(d.bf)bf=d.bf;bLimit=PAGE;render();window.scrollTo(0,0)}
  else if(d.rf){rf=d.rf;render()}
  else if(d.bf){bf=d.bf;bLimit=PAGE;render()}
  else if(d.hreg){hReg=d.hreg;render()}
  else if(d.morebk){bLimit+=PAGE;render()}
  else if(d.bk){setBooking(b,d)}
  else if(d.importh){importHotels(b)}
  else if(d.multi){$("fileMany").click()}
  else if(d.destup){cur={destImg:d.destup};$("fileOne").click()}
  else if(d.destclr){var inp=document.querySelector('.dimg-url[data-k="'+d.destclr+'"]'),pv=document.querySelector('.dimg-pv[data-k="'+d.destclr+'"]');if(inp)inp.value="";if(pv)pv.removeAttribute("src");toast("تم مسح الصورة — احفظ الإعدادات لتطبيقها")}
  else if(d.new){openEdit(d.new,null)}
  else if(d.savecfg){saveCfg()}
  else if(d.setpass){setPass()}
  else if(d.csv){exportCsv(d.csv)}
  else if(d.appall){if(confirm("اعتماد كل الآراء المنتظرة؟"))api({op:"approve_all"}).then(function(j){if(j.ok){D.reviews.forEach(function(r){if(r.status==="pending")r.status="approved"});render();toast("تم اعتماد "+j.n+" رأي")}else fail(j)}).catch(oops)}
  else if(d.dup){var src=find(d.dup,d.id),cp=Object.assign({},src,{name_ar:(src.name_ar||"")+" (نسخة)",name_en:src.name_en?src.name_en+" (copy)":"",active:"0",sort:""});delete cp.id;save("offers",cp).then(function(){return load("offers")}).then(render).catch(oops)}
  else if(d.edit){openEdit(d.edit,find(d.edit,d.id))}
  else if(d.st){api({op:"status",id:d.id,status:d.st}).then(function(j){if(j.ok){find("reviews",d.id).status=d.st;render();toast(d.st==="approved"?"تم الاعتماد — يظهر في الموقع":"تم الرفض")}else fail(j)}).catch(oops)}
  else if(d.del){if(confirm("حذف نهائي؟"))api({op:"delete",type:d.del,id:d.id}).then(function(j){if(j.ok){D[d.del]=D[d.del].filter(function(x){return String(x.id)!==String(d.id)});render();toast("تم الحذف")}else fail(j)}).catch(oops)}
  else if(d.tg){var it=find(d.tg,d.id),n=Object.assign({},it,{active:isOn(it)?"0":"1"});save(d.tg,n).then(function(){it.active=n.active;render()}).catch(oops)}
  else if(d.mv){var t=d.type,L=sorted(t),i=L.map(function(x){return String(x.id)}).indexOf(String(d.id)),k=i+(+d.mv);if(k<0||k>=L.length)return;
    var x=L[i];L[i]=L[k];L[k]=x;b.disabled=!0;
    Promise.all(L.map(function(it,idx){if(+it.sort===idx+1)return null;var n=Object.assign({},it,{sort:idx+1});return save(t,n,1).then(function(){it.sort=idx+1})})).then(render).catch(function(e){oops(e);render()})}
};
$("view").addEventListener("input",function(e){var id=e.target.id;
  if(id==="rq"){rq=e.target.value;applySearch()}
  else if(id==="bq"){bq=e.target.value;bLimit=PAGE;var q=bq.trim().toLowerCase();
    var L=D.bookings.filter(function(b){return bf==="all"||(bf==="new"?!isBooked(b):isBooked(b))}).filter(function(b){return!q||[b.order,b.name,b.phone,b.hotel,b.region].join(" ").toLowerCase().indexOf(q)>=0});
    $("bkList").innerHTML=bookingList(L)}
  else if(e.target.classList.contains("dimg-url")){var pv=document.querySelector('.dimg-pv[data-k="'+e.target.dataset.k+'"]');if(pv)pv.src=e.target.value}});

/* ======================= edit dialog ======================= */
var F={offers:[["name_ar","اسم المسار / الرحلة (عربي)","t"],["name_en","Route name (English)","t"],["img","صورة العرض","img"],["features_ar","المميزات (سطر لكل ميزة)","a"],["features_en","Features (one per line — اختياري)","a"],["sort","الترتيب (الأصغر يظهر أولاً)","n"]],
 hotels:[["name_ar","اسم الفندق (عربي)","t"],["name_en","Hotel name (English)","t"],["region","المنطقة","dest"],["price_stay","سعر الإقامة لليلة (جنيه — اختياري)","n"],["price_day","سعر الداي يوز (جنيه — اختياري)","n"],["img","صورة الفندق","img"],["video","رابط فيديو (اختياري)","t"],["sort","الترتيب","n"]],
 gallery:[["url","الصورة","img"],["caption_ar","تعليق (عربي)","t"],["caption_en","Caption (EN)","t"],["sort","الترتيب","n"]],
 reviews:[["name","اسم العميل","t"],["trip","الرحلة أو الفندق","t"],["rating","التقييم (1 إلى 5)","n"],["text","نص الرأي","a"]]};
var TT={offers:"عرض / مسار",hotels:"فندق",gallery:"صورة",reviews:"رأي"};
function fieldHtml(f,v){var id="f_"+f[0];
  if(f[2]==="a")return'<div class="field"><label for="'+id+'">'+f[1]+'</label><textarea id="'+id+'">'+esc(v)+'</textarea></div>';
  if(f[2]==="n")return'<div class="field"><label for="'+id+'">'+f[1]+'</label><input id="'+id+'" type="number" inputmode="numeric" min="0" value="'+esc(v)+'"></div>';
  if(f[2]==="dest")return'<div class="field"><label for="'+id+'">'+f[1]+'</label><select id="'+id+'">'+DESTS.map(function(d){return'<option value="'+d[0]+'"'+(d[0]===v?" selected":"")+'>'+d[1]+'</option>'}).join("")+'</select></div>';
  if(f[2]==="img")return'<div class="field"><label for="'+id+'">'+f[1]+'</label><div class="imgbox"><img id="pv" alt="" src="'+esc(v)+'"><button type="button" class="btn sm" id="up">📷 رفع صورة</button></div><input id="'+id+'" type="text" dir="ltr" placeholder="أو الصق رابط الصورة (https://...)" value="'+esc(v)+'" style="margin-top:8px"><p class="hint">اختر صورة من الموبايل وهتترفع وتتظبط تلقائياً.</p></div>';
  return'<div class="field"><label for="'+id+'">'+f[1]+'</label><input id="'+id+'" type="text" value="'+esc(v)+'"'+(f[0]==="video"?' dir="ltr"':"")+'></div>'}
function openEdit(t,item){cur={t:t,item:item};$("dt").textContent=(item?"تعديل ":"إضافة ")+TT[t];
  var h=F[t].map(function(f){var v=item?item[f[0]]:(f[0]==="rating"?5:f[0]==="region"&&hReg!=="all"?hReg:"");return fieldHtml(f,v==null?"":v)}).join("");
  if(t!=="reviews")h+='<div class="field"><label for="f_active">الحالة</label><select id="f_active"><option value="1">ظاهر في الموقع</option><option value="0">مخفي</option></select></div>';
  $("dbody").innerHTML=h;
  if($("f_active"))$("f_active").value=item&&!isOn(item)?"0":"1";
  var inp=$("f_img")||$("f_url");
  if(inp)inp.oninput=function(){$("pv").src=inp.value};
  if($("up"))$("up").onclick=function(){$("fileOne").click()};
  $("dlg").showModal()}
$("dc").onclick=function(){$("dlg").close()};
$("ds").onclick=function(){var t=cur.t,it=Object.assign({},cur.item||{});F[t].forEach(function(f){it[f[0]]=$("f_"+f[0]).value.trim()});
  if($("f_active"))it.active=$("f_active").value;$("ds").disabled=!0;
  save(t,it).then(function(){$("dlg").close();return load(t)}).then(render).catch(oops).then(function(){$("ds").disabled=!1})};

/* ======================= image upload (resized on the phone, stored in Drive) ======================= */
function shrink(file){return new Promise(function(res,rej){var im=new Image,u=URL.createObjectURL(file);im.onload=function(){var s=Math.min(1,IMG_MAX/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",IMG_Q).split(",")[1])};im.onerror=function(){URL.revokeObjectURL(u);toast(ERR.bad_type,1);rej(0)};im.src=u})}
function upload(file){return shrink(file).then(function(b64){return api({op:"upload",mime:"image/jpeg",data:b64})}).then(function(j){if(!j.ok){fail(j);throw 0}return j.url})}
$("fileOne").onchange=function(){var f=this.files[0];this.value="";if(!f)return;toast("جاري رفع الصورة...");
  upload(f).then(function(u){
    if(cur&&cur.destImg){var k=cur.destImg;cur.destImg=null;var inp=document.querySelector('.dimg-url[data-k="'+k+'"]'),pv=document.querySelector('.dimg-pv[data-k="'+k+'"]');if(inp)inp.value=u;if(pv)pv.src=u;toast("تم رفع صورة الوجهة ✓ — اضغط حفظ الإعدادات");return}
    var inp2=$("f_img")||$("f_url");if(inp2){inp2.value=u;var p=$("pv");if(p)p.src=u}toast("تم رفع الصورة ✓")
  }).catch(oops)};
$("fileMany").onchange=function(){var fs=[].slice.call(this.files);this.value="";if(!fs.length)return;var n=0;
  fs.reduce(function(p,f,i){return p.then(function(){toast("رفع "+(i+1)+" من "+fs.length+"...");return upload(f).then(function(u){return save("gallery",{url:u,caption_ar:"",caption_en:"",active:"1"},1)}).then(function(){n++})})},Promise.resolve())
  .catch(oops).then(function(){n===fs.length?toast("تم رفع "+n+" صورة ✓"):toast("تم رفع "+n+" من "+fs.length+" فقط — راجع الاتصال وحاول مرة أخرى",1);return load("gallery")}).then(function(){tab="gallery";render()}).catch(oops)};

/* ======================= start ======================= */
if(pass){api({op:"bootstrap"}).then(function(j){if(j.ok){applyBoot(j);enter()}else logout()}).catch(function(e){console.error("[admin] auto-login",e);logout()})}
