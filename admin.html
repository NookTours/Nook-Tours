function viewHome(){
  var today=ymd(new Date()),wk=new Date();wk.setDate(wk.getDate()-6);var wkS=ymd(wk);
  var B=D.bookings,tB=B.filter(function(b){return dayOf(b.date)===today}).length,wB=B.filter(function(b){return dayOf(b.date)>=wkS}).length;
  var newB=B.filter(function(b){return!isBooked(b)}).length,pendR=D.reviews.filter(function(r){return r.status==="pending"}).length;
  var ov=D.offers.filter(isOn).length,hv=D.hotels.filter(isOn).length;
  var doneB=B.length-newB,rate=B.length?Math.round(doneB/B.length*100):0;

    kpiTile("bookings",'data-bf="done"',"check","k-ok",doneB,"حجوزات مؤكدة")+
    kpiTile("bookings",'data-bf="new"',"clock","k-cu",newB,"طلبات لسه ما اتأكدتش",newB>0)+
    kpiTile("reports","","trend","k-sky",rate+"%","نسبة التأكيد")+
    kpiTile("bookings",'data-bf="all"',"cal","k-pu",tB+" / "+wB,"النهارده / آخر 7 أيام")+
    kpiTile("reviews","","star","k-red",pendR,"آراء بانتظار موافقتك",pendR>0)+
    kpiTile("offers","","map","",ov,"عروض ظاهرة من "+D.offers.length)+
    kpiTile("hotels","","hotel","k-ok",D.hotels.length?hv:"—",D.hotels.length?"فنادق ظاهرة":"الفنادق الأساسية")+'</div>';
  var mch=monthChart(B);

  var cnt={},days=[];B.forEach(function(b){var d=dayOf(b.date);d&&(cnt[d]=(cnt[d]||0)+1)});
  for(var i=CHART_DAYS-1;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(ymd(d))}
  var mx=Math.max.apply(null,days.map(function(d){return cnt[d]||0}).concat([1]));
  var ch='<div class="card"><b>الحجوزات آخر 14 يوم</b><div class="chart" aria-label="رسم الحجوزات اليومية">'+days.map(function(d){var n=cnt[d]||0;return'<div class="'+(d===today?"today":"")+'" title="'+d+': '+n+'"><span>'+(n||"")+'</span><i style="height:'+Math.round(n/mx*100)+'%"></i><span>'+(+d.slice(8))+'</span></div>'}).join("")+'</div></div>';

  var hc={};B.forEach(function(b){var h=String(b.hotel||"").trim();h&&(hc[h]=(hc[h]||0)+1)});
  var top=Object.keys(hc).sort(function(a,b){return hc[b]-hc[a]}).slice(0,5),tmx=top.length?hc[top[0]]:1;
  var th='<div class="card"><b>أكثر الفنادق طلباً</b>'+(top.map(function(h){return'<div class="list-row" style="display:block"><div style="display:flex;justify-content:space-between"><span>'+esc(h)+'</span><b>'+hc[h]+'</b></div><div class="bar-h"><i style="width:'+Math.round(hc[h]/tmx*100)+'%"></i></div></div>'}).join("")||'<div class="empty">لسه مفيش حجوزات</div>')+'</div>';
  var last='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>آخر الطلبات</b><button class="btn ghost sm" data-go="bookings">عرض الكل</button></div>'+(B.slice(0,5).map(function(b){return'<div class="list-row"><div><b>'+esc(b.name)+'</b><div class="hint" style="margin:0">'+esc(b.hotel)+' · '+esc(b.order)+'</div></div><span class="pill '+(isBooked(b)?"ok":"wait")+'">'+(isBooked(b)?"تم الحجز":"جديد")+'</span></div>'}).join("")||'<div class="empty">لسه مفيش حجوزات</div>')+'</div>';
  var sc='<div class="card"><b>اختصارات</b><div class="acts"><button class="btn gold" data-new="offers">+ عرض جديد</button><button class="btn" data-new="hotels">+ فندق</button><button class="btn" data-multi="1">+ رفع صور</button><button class="btn ghost" data-go="settings">📢 شريط الإعلانات</button></div><p class="hint">التغييرات تظهر في الموقع فوراً بعد الحفظ.</p></div>';
  return'<h2>نظرة عامة</h2><p class="sub">ملخص الحجوزات والموقع — '+esc(today)+'</p>'+kp+'<div class="grid2"><div>'+mch+ch+last+'</div><div>'+th+sc+helpBox()+'</div></div>';

function kpiTile(go,extra,icon,tone,val,label,hot){return'<button class="kpi'+(hot?" hot":"")+'" data-go="'+go+'" '+extra+'><span class="kic '+tone+'"><svg class="ic" aria-hidden="true"><use href="#i-'+icon+'"/></svg></span><span class="kv"><b>'+esc(val)+'</b><small>'+esc(label)+'</small></span></button>'}

function monthChart(B){var now=new Date(),ms=[],tot={},ok={};
  for(var i=MONTHS-1;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2))}
  B.forEach(function(b){var m=dayOf(b.date).slice(0,7);if(!m)return;tot[m]=(tot[m]||0)+1;isBooked(b)&&(ok[m]=(ok[m]||0)+1)});
  var mx=Math.max.apply(null,ms.map(function(m){return tot[m]||0}).concat([1])),cur=ms[ms.length-1];
  return'<div class="card"><div class="bk-top"><b>تحليل شهري</b><span class="hint" style="margin:0"><span style="color:var(--bar)">■</span> الطلبات · <span style="color:var(--accent-text)">■</span> المؤكدة</span></div><div class="chart" style="grid-template-columns:repeat('+MONTHS+',1fr);height:170px" aria-label="الطلبات والحجوزات المؤكدة شهرياً">'+
    ms.map(function(m){var t=tot[m]||0,o=ok[m]||0;return'<div class="'+(m===cur?"today":"")+'" title="'+m+': '+t+' طلب · '+o+' مؤكد"><span>'+(t||"")+'</span><div style="display:flex;flex-direction:row;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center"><i style="height:'+Math.round(t/mx*100)+'%;background:var(--bar)"></i><i style="height:'+Math.round(o/mx*100)+'%;background:var(--gold)"></i></div><span>'+(+m.slice(5))+'/'+m.slice(2,4)+'</span></div>'}).join("")+'</div></div>'}
function helpBox(){return'<details class="card help"><summary>📘 دليل سريع</summary><ol><li><b>الحجوزات:</b> كل طلب من الموقع بيوصل هنا "جديد". كلّم العميل بزرار واتساب، ولما تأكد اضغط "✓ تم الحجز".</li><li><b>الآراء:</b> رأي الزائر بيوصل "بانتظار" — اعتمده عشان يظهر.</li><li><b>العروض والفنادق والصور:</b> من "المحتوى". أول ما تضيف عنصر، المحتوى الأساسي في الموقع بيتبدّل بمحتواك. في الفنادق تقدر تستورد القايمة الحالية بضغطة.</li><li><b>الإعدادات:</b> شريط الإعلانات، الأرقام، صور الوجهات، التواصل، وإظهار الأقسام.</li><li><b>نسخة احتياطية:</b> من الإعدادات نزّل CSV لأي قسم.</li></ol></details>'}

function bookingCard(b){
  var done=isBooked(b),ph=intlPhone(b.phone),guests=(+b.adults||0)+" بالغ"+(+b.kids?" + "+b.kids+" طفل":"");
  var msg="مرحباً "+(b.name||"")+" 👋\nبخصوص طلبك رقم "+(b.order||"")+" — "+(b.hotel||"")+(b.checkin?" ("+b.checkin+")":"");
  var dates=b.checkin?esc(b.checkin)+(b.checkout?" ← "+esc(b.checkout):"")+(b.nights?" · "+esc(b.nights)+" ليالي":""):"—";
  return'<div class="card"><div class="bk-top"><b>'+esc(b.name||"بدون اسم")+'</b><span class="pill '+(done?"ok":"wait")+'">'+(done?"تم الحجز":"جديد")+'</span></div>'+
    '<div class="bk-meta">'+esc(b.order)+' · '+esc(b.date)+'</div>'+
    '<div class="bk-grid"><span>🏨 '+esc(b.hotel||"—")+(b.region?' — '+esc(b.region):"")+'</span><span>📅 '+dates+'</span><span>👥 '+esc(guests)+(b.ages?' ('+esc(b.ages)+')':"")+'</span><span>🏷️ '+esc(b.type||"—")+(b.room?' · '+esc(b.room):"")+'</span>'+(b.occasion?'<span>🎉 '+esc(b.occasion)+'</span>':"")+(b.email?'<span dir="ltr" style="text-align:end">✉️ '+esc(b.email)+'</span>':"")+'</div>'+
    (b.notes?'<p class="bk-note">'+esc(b.notes)+'</p>':"")+
    '<div class="acts">'+(done?'<button class="btn ghost sm" data-bk="لا" data-row="'+esc(b.row)+'" data-order="'+esc(b.order)+'">إلغاء التأكيد</button>':'<button class="btn ok sm" data-bk="نعم" data-row="'+esc(b.row)+'" data-order="'+esc(b.order)+'">✓ تم الحجز</button>')+
    (ph?'<a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(ph)+'?text='+encodeURIComponent(msg)+'">واتساب</a><a class="btn ghost sm" href="tel:+'+esc(ph)+'">اتصال</a>':"")+'</div></div>';
}

    .filter(function(b){if(!q)return!0;var hay=[b.order,b.name,b.phone,b.hotel,b.region,b.email].join(" ").toLowerCase();return hay.indexOf(q)>=0||(qd.length>=3&&String(b.order||"").replace(/\D/g,"").indexOf(qd)>=0)})}

  if($("f_active"))$("f_active").value=item&&!isOn(item)?"0":"1";
  var inp=$("f_img")||$("f_url");
  if(inp)inp.oninput=function(){$("pv").src=inp.value};
  if($("up"))$("up").onclick=function(){$("fileOne").click()};
  $("dlg").showModal()}
$("dc").onclick=function(){$("dlg").close()};
$("d2c").onclick=function(){$("dlg2").close()};
$("dlg2").onclick=function(e){var b=e.target.closest("button[data-bk]");if(!b)return;$("dlg2").close();setBooking(b,b.dataset)};
$("ds").onclick=function(){var t=cur.t,it=Object.assign({},cur.item||{});F[t].forEach(function(f){it[f[0]]=$("f_"+f[0]).value.trim()});
  if($("f_active"))it.active=$("f_active").value;$("ds").disabled=!0;
  save(t,it).then(function(){$("dlg").close();return load(t)}).then(render).catch(oops).then(function(){$("ds").disabled=!1})};

function shrink(file){return new Promise(function(res,rej){var im=new Image,u=URL.createObjectURL(file);im.onload=function(){var s=Math.min(1,IMG_MAX/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",IMG_Q).split(",")[1])};im.onerror=function(){URL.revokeObjectURL(u);toast(ERR.bad_type,1);rej(0)};im.src=u})}
function upload(file){return shrink(file).then(function(b64){return api({op:"upload",mime:"image/jpeg",data:b64})}).then(function(j){if(!j.ok){fail(j);throw 0}return j.url})}
$("fileOne").onchange=function(){var f=this.files[0];this.value="";if(!f)return;toast("جاري رفع الصورة...");
  upload(f).then(function(u){
    if(cur&&cur.fndRow!==undefined){var row=document.querySelectorAll("#fndList .fnd-row")[cur.fndRow];cur=null;row&&(row.querySelector(".f-img").value=u,row.querySelector(".f-pv").src=u);toast("تم رفع الصورة ✓ — اضغط حفظ ونشر");return}
    if(cur&&cur.heroImg){cur=null;var hi=$("c_hero_img");hi&&(hi.value=u,$("heroPv").src=u);toast("تم رفع صورة الهيرو ✓ — اضغط حفظ");return}
    if(cur&&cur.destImg){var k=cur.destImg;cur.destImg=null;var inp=document.querySelector('.dimg-url[data-k="'+k+'"]'),pv=document.querySelector('.dimg-pv[data-k="'+k+'"]');if(inp)inp.value=u;if(pv)pv.src=u;toast("تم رفع صورة الوجهة ✓ — اضغط حفظ الإعدادات");return}
    var inp2=$("f_img")||$("f_url");if(inp2){inp2.value=u;var p=$("pv");if(p)p.src=u}toast("تم رفع الصورة ✓")
  }).catch(oops)};
$("fileMany").onchange=function(){var fs=[].slice.call(this.files);this.value="";if(!fs.length)return;var n=0;
  fs.reduce(function(p,f,i){return p.then(function(){toast("رفع "+(i+1)+" من "+fs.length+"...");return upload(f).then(function(u){return save("gallery",{url:u,caption_ar:"",caption_en:"",active:"1"},1)}).then(function(){n++})})},Promise.resolve())
  .catch(oops).then(function(){n===fs.length?toast("تم رفع "+n+" صورة ✓"):toast("تم رفع "+n+" من "+fs.length+" فقط — راجع الاتصال وحاول مرة أخرى",1);return load("gallery")}).then(function(){tab="gallery";render()}).catch(oops)};

if(pass){api({op:"bootstrap"}).then(function(j){if(j.ok){applyBoot(j);enter()}else logout()}).catch(function(e){console.error("[admin] auto-login",e);logout()})}
