<html lang="en" dir="ltr">

<style>
:root{--navy:#0d2b4e;--sea:#0e7c8f;--sky:#e6f3f6;--gold:#c39a4f;--bg:#f4f9fb;--card:#fff;--line:#d6e5ea;--ink:#12263a;--mute:#5b7384;--surf:#fff;--head:#0d2b4e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#081833;--card:#0e2347;--surf:#0b1d3d;--line:#22407a;--ink:#eef3fb;--mute:#a8b9d6;--sky:#14305f;--head:#f2c75c;--sea:#e3b44a;color-scheme:dark}
[data-theme=dark] footer{background:#050f24}
[data-theme=dark] header .logo{background:#fff;border-radius:10px;padding:3px 8px}
[data-theme=dark] .seg button[aria-pressed=true]{background:var(--sea);border-color:var(--sea)}
[data-theme=dark] .wkn{background:#3a2f17}[data-theme=dark] #err{color:#ff9d8f}
body{transition:background .3s,color .3s}
.tools{display:flex;gap:8px;align-items:center}
#theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--head);background:none;color:var(--head);display:grid;place-items:center;cursor:pointer;padding:0}
#theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,system-ui,sans-serif;line-height:1.7}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--surf);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:92px;transition:height .3s}
header.sm .wrap{height:58px}
header{transition:box-shadow .3s}header.sm{box-shadow:0 4px 18px rgba(13,43,78,.1)}
.logo{display:block;height:46px}
header .logo{height:72px;transition:height .3s}
header.sm .logo{height:42px}
#lang{border:1px solid var(--head);background:none;color:var(--head);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
