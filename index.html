<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Nook Tours — curated Red Sea stays in Dahab, Ain Sokhna, Hurghada. Premium booking, schools and universities rates.">
<meta name="theme-color" content="#0b1220">
<title>Nook Tours — Curated Red Sea Escapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   NOOK TOURS — Premium redesign
   Edit colors in :root. Dark mode: [data-theme=dark]
   ========================================================= */
:root{
  --ink:#0b1220;--ink-soft:#1a2438;--muted:#5c6b7a;--line:#e6e0d6;
  --paper:#faf7f2;--card:#ffffff;--gold:#b8956c;--gold-deep:#9a7a52;
  --gold-soft:#f3ebe0;--sea:#0e4a5c;--sea-soft:#e8f2f4;--accent:#c45c3e;
  --ok:#2d6a4f;--err:#b23a2f;
  --shadow:0 20px 50px rgba(11,18,32,.08);--shadow-sm:0 8px 24px rgba(11,18,32,.06);
  --radius:18px;--radius-sm:12px;
  --font-display:"Cormorant Garamond",Georgia,serif;--font-body:"Outfit",system-ui,sans-serif;
  --header-h:76px;color-scheme:light;
}
[data-theme=dark]{
  --ink:#f3efe8;--ink-soft:#c8c2b6;--muted:#9aa3ad;--line:#2a3344;--paper:#0b1220;
  --card:#121a2b;--gold:#d4b896;--gold-deep:#e0c9a8;--gold-soft:#1c2436;--sea:#5eb3c4;
  --sea-soft:#142433;--shadow:0 20px 50px rgba(0,0,0,.35);--shadow-sm:0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-weight:400;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1120px,calc(100% - 40px));margin-inline:auto}
.site-header{position:sticky;top:0;z-index:40;height:var(--header-h);background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s,height .3s}
.site-header.is-scrolled{border-bottom-color:var(--line);box-shadow:var(--shadow-sm);--header-h:64px}
.site-header .inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo-link{display:flex;align-items:center;gap:10px}
.logo-link img{height:48px;width:auto;background:#fff;border-radius:10px;padding:3px 8px;transition:height .3s}
.site-header.is-scrolled .logo-link img{height:38px}
.nav{display:flex;align-items:center;gap:6px}
.nav a{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:color .2s,background .2s}
.nav a:hover,.nav a.is-active{color:var(--ink);background:var(--gold-soft)}
.tools{display:flex;align-items:center;gap:8px}
.icon-btn,.lang-btn{height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:border-color .2s,transform .15s}
.icon-btn:hover,.lang-btn:hover{border-color:var(--gold)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lang-btn{font-size:13px;font-weight:600;letter-spacing:.02em}
.nav-toggle{display:none}
@media (max-width:860px){.nav{display:none}.nav-toggle{display:inline-flex}.nav.open{display:flex;flex-direction:column;position:absolute;left:20px;right:20px;top:calc(var(--header-h) + 8px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);z-index:50}.nav.open a{width:100%}}
.hero{position:relative;min-height:min(88vh,820px);display:grid;align-items:end;padding:120px 0 72px;overflow:hidden;background:radial-gradient(1200px 600px at 80% 0%,rgba(184,149,108,.18),transparent 60%),radial-gradient(900px 500px at 10% 80%,rgba(14,74,92,.12),transparent 55%),linear-gradient(180deg,var(--paper),color-mix(in srgb,var(--gold-soft) 55%,var(--paper)))}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");mix-blend-mode:multiply}
[data-theme=dark] .hero::before{mix-blend-mode:soft-light;opacity:.25}
.hero-grid{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:end}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px}}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:18px}
.kicker::before{content:"";width:28px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.6rem,5.5vw,4.4rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 18px;max-width:14ch}
.hero .lead{font-size:1.08rem;color:var(--muted);max-width:42ch;margin:0 0 32px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--paper)}.btn-primary:hover{background:var(--ink-soft)}
[data-theme=dark] .btn-primary{background:var(--gold);color:#0b1220}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--gold);background:var(--gold-soft)}
.btn-gold{background:var(--gold);color:#0b1220}.btn-gold:hover{background:var(--gold-deep);color:#fff}
.hero-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;inset:auto -20% -40% 40%;height:180px;background:radial-gradient(circle,rgba(184,149,108,.25),transparent 70%);pointer-events:none}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.stat{text-align:center;padding:12px 8px;border-radius:14px;background:var(--gold-soft)}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.trust-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
section{padding:88px 0}
.sec-head{margin-bottom:40px;max-width:560px}
.sec-head h2{font-family:var(--font-display);font-weight:500;font-size:clamp(2rem,3.5vw,2.8rem);margin:0 0 12px;letter-spacing:-.02em;line-height:1.15}
.sec-head p{margin:0;color:var(--muted);font-size:1.05rem}
.dest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:960px){.dest-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.dest-grid{grid-template-columns:1fr}}
.dest-card{position:relative;border-radius:22px;overflow:hidden;min-height:280px;background:linear-gradient(160deg,var(--c1,#4aa8cf),var(--c2,#0d5e86));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;isolation:isolate;cursor:pointer;transition:transform .25s,box-shadow .25s;border:1px solid color-mix(in srgb,#fff 12%,transparent)}
.dest-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.dest-card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55))}
.dest-card h3{margin:0 0 4px;font-family:var(--font-display);font-size:1.55rem;font-weight:600}
.dest-card span{font-size:13px;opacity:.85}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media (max-width:800px){.about-grid{grid-template-columns:1fr}}
.rules{display:grid;gap:14px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:18px;border-radius:var(--radius-sm);background:var(--card);border:1px solid var(--line)}
.rule .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-deep);font-weight:700;font-size:14px}
.rule h4{margin:0 0 4px;font-size:15px}.rule p{margin:0;font-size:14px;color:var(--muted)}
.why-list{display:grid;gap:12px;margin-top:8px;padding:0}
.why-list li{list-style:none;padding:14px 16px 14px 44px;position:relative;background:var(--sea-soft);border-radius:12px;font-size:14.5px}
.why-list li::before{content:"✓";position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--sea);font-weight:700}
[dir=rtl] .why-list li{padding:14px 44px 14px 16px}[dir=rtl] .why-list li::before{left:auto;right:16px}
.edu{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(11,18,32,.92),rgba(14,74,92,.85)),radial-gradient(800px 400px at 100% 0%,rgba(184,149,108,.35),transparent);color:#f7f3eb;padding:48px;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}
@media (max-width:800px){.edu{grid-template-columns:1fr;padding:32px 24px}}
.edu .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(212,184,150,.2);color:var(--gold);margin-bottom:14px}
.edu h2{font-family:var(--font-display);font-weight:500;font-size:clamp(1.8rem,3vw,2.4rem);margin:0 0 12px;color:#fff}
.edu p{margin:0 0 12px;color:rgba(247,243,235,.82);max-width:48ch}
.edu-side{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px;backdrop-filter:blur(8px)}
.edu-side ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.edu-side li{font-size:14px;display:flex;gap:10px;align-items:flex-start}
.edu-side li::before{content:"◆";color:var(--gold);font-size:10px;margin-top:5px}
#book{background:var(--gold-soft)}[data-theme=dark] #book{background:var(--sea-soft)}
.book-shell{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.book-top{padding:28px 28px 0}.form-body{padding:8px 28px 28px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:20px}
.seg button{border:0;background:transparent;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
[data-theme=dark] .seg button[aria-pressed=true]{background:var(--gold);color:#0b1220}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.textarea{min-height:88px;resize:vertical}
.note{font-size:13.5px;padding:12px 14px;border-radius:12px;background:var(--sea-soft);color:var(--sea);margin-top:8px}
.note.ld{opacity:.85}.note.warn{background:color-mix(in srgb,var(--gold) 18%,var(--paper));color:var(--gold-deep)}
#err{color:var(--err);font-size:14px;min-height:1.2em;margin:8px 0}
.ages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.form-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.returning{margin-bottom:18px;padding:16px;border-radius:14px;border:1px dashed var(--line);background:var(--paper)}
.returning summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--gold-deep)}
.ov,.wl{position:fixed;inset:0;z-index:100;background:rgba(11,18,32,.55);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.ov.on,.wl{display:flex}.wl.out{opacity:0;transition:opacity .4s}
.pop,.wlc{width:min(440px,100%);background:var(--card);border-radius:24px;padding:28px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.wlc{text-align:center}.wlc .logo{height:56px;margin:0 auto 16px;background:#fff;border-radius:12px;padding:4px 10px}
.wlc h2{font-family:var(--font-display);font-size:1.8rem;margin:0 0 10px}
.wlu{text-align:start;margin:16px 0;padding:0 0 0 18px;color:var(--muted)}
[dir=rtl] .wlu{padding:0 18px 0 0}
.wll{position:absolute;top:16px;inset-inline-end:16px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
#vidBox{display:none;margin-top:12px;border-radius:14px;overflow:hidden}
#vidBox video{width:100%;display:block;max-height:200px;object-fit:cover}
footer{background:var(--ink);color:rgba(247,243,235,.78);padding:48px 0 28px;margin-top:0}
[data-theme=dark] footer{background:#060b14}
footer .logo{height:48px;margin:0 auto 16px;background:#fff;border-radius:12px;padding:4px 10px}
footer .wrap{text-align:center}footer a{color:var(--gold)}
.foot-nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;margin:18px 0;font-size:14px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

.edu-pct{
  display:inline-block;margin:0 0 14px;padding:8px 14px;border-radius:999px;
  background:linear-gradient(90deg,rgba(212,184,150,.35),rgba(212,184,150,.12));
  color:#f5e6c8;font-weight:700;font-size:14px;letter-spacing:.04em;
}
.dest-card .dest-bg{
  position:absolute;inset:0;z-index:-2;
  background-size:cover;background-position:center;
  transition:transform .5s ease;
}
.dest-card:hover .dest-bg{transform:scale(1.06)}
.dest-card::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(11,18,32,.15) 0%,rgba(11,18,32,.75) 100%);
}

.dh-box .dro{padding:8px 12px;border-radius:10px;margin-top:6px;font-size:13.5px;background:var(--paper)}
.dh-box .dro.on{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.dsel{margin-top:10px;font-size:13.5px;font-weight:600}
.happy{font-size:14px;color:var(--muted);margin-top:8px}

</style>
</head>
<body>
<!-- ========== HEADER ========== -->
<header class="site-header" id="header">
  <div class="wrap inner">
    <a class="logo-link" href="#top" aria-label="Nook Tours home">
      <img class="logo lg" alt="Nook Tours" width="120" height="48">
    </a>
    <nav class="nav" id="nav" aria-label="Primary">
      <a href="#top" data-t="navHome"></a>
      <a href="#destinations" data-t="navDest"></a>
      <a href="#about" data-t="navAbout"></a>
      <a href="#education" data-t="navEdu"></a>
      <a href="#book" data-t="navBook"></a>
    </nav>
    <div class="tools">
      <button type="button" class="lang-btn" id="lang" aria-label="Language">EN</button>
      <button type="button" class="icon-btn" id="theme" aria-label="Theme"></button>
      <button type="button" class="icon-btn nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="kicker" data-t="heroKicker"></div>
        <h1 data-t="heroTitle"></h1>
        <p class="lead" data-t="heroSub"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#destinations" data-t="heroCta"></a>
          <a class="btn btn-ghost" href="#book" data-t="heroCta2"></a>
        </div>
        <div class="trust-row">
          <span class="chip" data-t="trust1"></span>
          <span class="chip" data-t="trust2"></span>
          <span class="chip" data-t="trust3"></span>
          <span class="chip" data-t="trust4"></span>
        </div>
      </div>
      <div class="hero-card reveal">
        <p style="margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)" data-t="secHotels"></p>
        <p style="margin:0;color:var(--muted);font-size:14.5px" data-t="sub"></p>
        <div class="hero-stats">
          <div class="stat"><b>4</b><span data-t="destTitle"></span></div>
          <div class="stat"><b>30+</b><span data-t="hotels"></span></div>
          <div class="stat"><b>24/7</b><span data-t="contact"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="destinations">
    <div class="wrap">
      <div class="sec-head reveal">
        <div class="kicker" data-t="dest"></div>
        <h2 data-t="destTitle"></h2>
        <p data-t="destSub"></p>
      </div>
      <div class="dest-grid" id="destGrid"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about-grid">
      <div class="reveal">
        <div class="sec-head" style="margin-bottom:24px">
          <div class="kicker" data-t="abT"></div>
          <h2 data-t="aboutTitle"></h2>
          <p data-t="aboutLead"></p>
        </div>
        <div class="rules">
          <div class="rule"><div class="n">01</div><div><h4 data-t="r1"></h4><p data-t="ab2"></p></div></div>
          <div class="rule"><div class="n">02</div><div><h4 data-t="r2"></h4><p data-t="ab3"></p></div></div>
          <div class="rule"><div class="n">03</div><div><h4 data-t="r3"></h4><p data-t="ab4"></p></div></div>
        </div>
      </div>
      <div class="reveal">
        <div class="sec-head" style="margin-bottom:16px"><h2 data-t="whyTitle"></h2></div>
        <ul class="why-list">
          <li data-t="c1"></li>
          <li data-t="c2"></li>
          <li data-t="c3"></li>
          <li data-t="abS"></li>
        </ul>
        <div style="margin-top:24px"><a class="btn btn-gold" href="#book" data-t="heroCta2"></a></div>
      </div>
    </div>
  </section>

  <section id="education">
    <div class="wrap">
      <div class="edu reveal">
        <div>
          <span class="badge" data-t="eduBadge"></span>
          <div class="edu-pct" id="eduPct" data-t="eduPct"></div>
          <h2 data-t="eduTitle"></h2>
          <p data-t="eduSub"></p>
          <p data-t="eduBody"></p>
          <a class="btn btn-gold" href="#book" id="eduCta" data-t="eduCta"></a>
        </div>
        <div class="edu-side">
          <ul id="eduBullets">
            <li data-edu="0"></li>
            <li data-edu="1"></li>
            <li data-edu="2"></li>
            <li data-edu="3"></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <section id="book">
    <div class="wrap">
      <div class="sec-head reveal">
        <div class="kicker" data-t="book"></div>
        <h2 data-t="bookTitle"></h2>
        <p data-t="bookSub"></p>
      </div>
      <div class="book-shell reveal">
        <div class="book-top">
          <div class="seg" role="group" aria-label="Booking type">
            <button type="button" id="segStay" aria-pressed="true" data-t="stay"></button>
            <button type="button" id="segDay" aria-pressed="false" data-t="dayL"></button>
          </div>
        </div>
        <form class="form-body" id="bookForm" onsubmit="return false">
          <details class="returning" id="retBox">
            <summary data-t="rtog"></summary>
            <div class="fields" style="margin-top:12px">
              <div class="field"><label data-t="rrefL"></label><input id="rref" maxlength="4" inputmode="numeric" autocomplete="off"></div>
              <div class="field"><label data-t="rl4"></label><input id="rl4" maxlength="3" inputmode="numeric" autocomplete="off"></div>

function iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function dt(s){ return new Date(s+"T00:00:00"); }
function addD(s,n){ var d = dt(s); d.setDate(d.getDate()+n); return iso(d); }
function nightsN(a,b){
  if(!day && $("reg").value === "dahab" && a){
    var g = dt(a).getDay();
    if(g === 4) return 3;
    if(g === 0) return 4;
  }
  return Math.round((dt(b) - dt(a)) / 864e5);
}
function info(){
  var a = $("in").value, b = $("out").value, nt = $("nt"), wk = $("wk"), w = false;
  if(!day && $("reg").value === "dahab"){
    var g0 = a ? dt(a).getDay() : -1, sel = g0 === 4 || g0 === 0;
    nt.innerHTML = "<div>"+t("dhH")+"</div>"
      +"<div class='dro"+(g0===4?" on":"")+"'>"+t("dh4")+"</div>"
      +"<div class='dro"+(g0===0?" on":"")+"'>"+t("dh5")+"</div>"
      +(a && b && sel ? "<div class='dsel'>"+t("dhSel")+": "+t(g0===4?"dN4":"dN0")+" "+a+" · "+t("dhOut")+" "+t(g0===4?"dO4":"dO0")+" "+b+" · "+t("nights")+": "+nightsN(a,b)+"</div>" : "");
    nt.style.display = "block";
    wk.textContent = t("dhP"); wk.style.display = "block";
    return;
  }
  if(day){
    nt.style.display = "none";
    if(a){ var g = dt(a).getDay(); w = g == 4 || g == 5; }
  } else if(a && b && b > a){
    var n = nightsN(a,b);
    nt.textContent = t("nights")+": "+n; nt.style.display = "block";
    for(var i = 0; i < n; i++){ var g = dt(addD(a,i)).getDay(); if(g == 4 || g == 5) w = true; }
  } else nt.style.display = "none";
  wk.textContent = t("wkm");
  wk.style.display = (w && $("reg").value === "sokhna") ? "block" : "none";
}
function dh(){
  var d = !day && $("reg").value === "dahab";
  $("wOut").style.display = (day || d) ? "none" : "block";
  $("fRoom").style.display = (day || d) ? "none" : "block";
  $("fOccS").style.display = d ? "none" : "block";
  $("chp").style.display = d ? "none" : "";
  if(d){ $("room").selectedIndex = -1; $("occ").value = "0"; occ2(); }
  else if($("room").selectedIndex < 0) $("room").selectedIndex = 0;
  $("lIn").textContent = t(d ? "dtrip" : (day ? "vis" : "arr"));
  dates();
}
function dates(){
  var a = $("in").value, tm = addD(iso(new Date()), 1);
  if(a && a < tm){ $("err").textContent = t("eT"); $("in").value = a = tm; }
  else if($("err").textContent === t("eT")) $("err").textContent = "";
  var dd = !day && $("reg").value === "dahab";
  if(dd && a){
    var g = dt(a).getDay();
    if(g !== 4 && g !== 0){
      var k = 0;
      while(k < 7 && [4,0].indexOf(dt(addD(a,k)).getDay()) < 0) k++;
      a = addD(a, k); $("in").value = a;
      if(!quiet) $("err").textContent = t("eDh");
      g = dt(a).getDay();
    } else if($("err").textContent === t("eDh")) $("err").textContent = "";
    $("out").value = addD(a, g === 4 ? 4 : 5);
  }
  if(a){
    var mn = addD(a, 1);
    $("out").min = mn;
    if(!$("out").value || $("out").value < mn) $("out").value = mn;
  }
  info();
}

$("in").value = $("in").min;
$("out").value = addD($("in").value, 2);
$("in").oninput = dates; $("in").onchange = dates;
$("out").oninput = function(){
  var a = $("in").value, b = $("out").value;

};

$("go").onclick = function(){
  var hs = $("hotel"), x = hs.value === "x";
  var hn = x ? $("oh").value.trim() : H[hs.value][L];
  var a = $("in").value, b = $("out").value, nm = $("nm").value.trim(), ph = $("ph").value.trim(), e = $("err");
  if(x && !hn){ e.textContent = t("eH"); return; }
  if(!a){ e.textContent = t("eD"); return; }
  if(a < addD(iso(new Date()), 1)){ e.textContent = t("eT"); return; }
  if(!day && (!b || b <= a)){ e.textContent = t("eO"); return; }
  if(!nm){ e.textContent = t("eN"); return; }
  if(ph.replace(/\D/g,"").length < 10){ e.textContent = t("eP"); return; }
  var em = $("em").value.trim();
  if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ e.textContent = t("eE"); return; }
  e.textContent = "";
  var m = t("m"), n = parseInt($("kids").value) || 0;
  var ag = [].map.call($("ages").querySelectorAll("select"), function(s){ return s.value; }).join(", ");
  var r = [m[0], m[1]+": "+nm, m[2]+": "+ph, m[3]+": "+hn, m[4]+": "+t(day?"dayL":"stay"),
    day ? m[7]+": "+a : m[5]+": "+a+" "+m[6]+": "+b, m[8]+": "+$("ad").value];
  if(n) r.push(m[9]+": "+n+" ("+m[10]+": "+ag+")");
  if(!day){
    r.push(m[15]+": "+nightsN(a,b));
    if($("room").selectedIndex >= 0) r.push(m[11]+": "+t("rooms")[$("room").value]);
  }
  r.splice(4, 0, m[14]+": "+R.filter(function(q){ return q.k === $("reg").value; })[0][L]);
  if(em) r.splice(3, 0, m[16]+": "+em);
  if($("occ").value !== "0") r.push(m[12]+": "+t("occs")[$("occ").value]);
  var ot = $("ot").value.trim();
  if($("occ").value === "4" && ot) r.push(m[13]+": "+ot);
  if(profileNo) r.push(t("again"));
  rows = r;
  var A = T.ar, reg = R.filter(function(q){ return q.k === $("reg").value; })[0].ar, occ = $("occ").value;
  payload = {
    name: nm, phone: ph, email: em, region: reg,
    hotel: x ? hn : H[hs.value].ar,
    type: day ? "Day use" : "إقامة",
    checkin: a, checkout: day ? "" : b,
    nights: day ? "" : nightsN(a,b),
    adults: parseInt($("ad").value) || 0, kids: n, ages: n ? ag : "",
    room: day ? "" : A.rooms[$("room").value],
    occasion: occ !== "0" ? A.occs[occ] : "",
    notes: occ === "4" ? ot : "",
    lang: L, profileNo: profileNo || ""
  };
  $("ov").classList.add("on");
};

function sheetOn(){ return /^https:\/\/script\.google\.com\//.test(SHEET_URL); }

$("wa").onclick = function(){
  var btn = $("wa"), done = false, ctl = window.AbortController ? new AbortController() : null;
  var w = window.open("", "_blank");
  var oldTxt = btn.textContent;
  btn.disabled = true;
  btn.textContent = L === "ar" ? "جاري تجهيز رقم البروفايل..." : "Preparing your profile number...";
  function send(no){
    if(done) return; done = true;
    btn.disabled = false; btn.textContent = oldTxt;
    no = no || profileNo;
    var l = rows.slice();
    if(no) l.splice(1, 0, t("ord")+": "+no);
    var u = "https://wa.me/"+PHONE+"?text="+encodeURIComponent(l.join("\n"));
    if(w && !w.closed) w.location.href = u; else window.location.href = u;
    $("ov").classList.remove("on");
  }
  if(!sheetOn()){ send(""); return; }
  var fin = false;
  function finish(no){ if(fin) return; fin = true; if(no){ send(no); return; } findNo(send); }
  function findNo(cb){
    var p = (payload.phone || "").replace(/\D/g,""), i = 0;
    (function go(){
      i++;
      function retry(){ if(i < 3) setTimeout(go, 1500); else cb(""); }
      fetch(SHEET_URL+"?phone="+encodeURIComponent(p)).then(function(r){ return r.json(); })
        .then(function(j){ if(j && j.ok && j.found && (j.order || j.profileNo)) cb(j.order || j.profileNo); else retry(); })
        .catch(retry);
    })();
  }
  var to = setTimeout(function(){ if(ctl) ctl.abort(); finish(""); }, 15000);
  fetch(SHEET_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
    signal: ctl ? ctl.signal : undefined
  })
  .then(function(r){ return r.json(); })
  .then(function(j){ clearTimeout(to); finish(j && j.ok ? j.order : ""); })
  .catch(function(){ clearTimeout(to); finish(""); });
};
$("back").onclick = function(){ $("ov").classList.remove("on"); };

function applyProfile(j){
  profileNo = j.order || j.profileNo || "";
  if(j.name) $("nm").value = j.name;
  if(j.phone) $("ph").value = j.phone;
  if(j.email) $("em").value = j.email;
  autoNm = j.name || ""; autoEm = j.email || "";
  $("pid").value = profileNo || "";
}
function showKnown(s, name, order){
  s.style.display = "block"; s.textContent = ""; s.className = "note";
  if(name){
    s.appendChild(document.createTextNode(t("rwel1")));
    var n = document.createElement("b"); n.textContent = name; s.appendChild(n);
    s.appendChild(document.createTextNode(t("rwel2")));
  } else s.appendChild(document.createTextNode(t("phKnown1")));
  var o = document.createElement("b"); o.textContent = order || ""; s.appendChild(o);
  if(!name) s.appendChild(document.createTextNode(t("phKnown2")));
}
function clrAuto(){
  if(autoNm && $("nm").value === autoNm) $("nm").value = "";
  if(autoEm && $("em").value === autoEm) $("em").value = "";
  autoNm = ""; autoEm = "";
}
function checkPhone(){
  var p = ($("ph").value || "").replace(/\D/g,""), s = $("phs");
  if(p.length < 10){
    if(phCtl){ try{ phCtl.abort(); }catch(e){} }
    profileNo = ""; newNo = ""; $("pid").value = ""; phLast = ""; clrAuto();
    if(s.classList.contains("ld")){ s.className = "note"; s.textContent = ""; s.style.display = "none"; }
    return;
  }
  if(p === phLast) return;
  if(!sheetOn()) return;
  phLast = p;
  s.className = "note ld"; s.textContent = t("rsearch"); s.style.display = "block";
  if(phCtl){ try{ phCtl.abort(); }catch(e){} }
  phCtl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ if(phCtl) phCtl.abort(); }, 8000);
  fetch(SHEET_URL+"?phone="+encodeURIComponent(p), { signal: phCtl ? phCtl.signal : undefined })
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(to);
      if(j && j.ok && j.found){ applyProfile(j); showKnown(s, j.name || "", profileNo); }
      else if(j && j.error === "locked"){ s.className = "note"; s.style.display = "block"; s.textContent = t("rlock"); }
      else { profileNo = ""; clrAuto(); newNo = ""; $("pid").value = ""; s.className = "note"; s.textContent = ""; s.style.display = "none"; }
    })
    .catch(function(){
      clearTimeout(to);
      if(s.classList.contains("ld")){ s.className = "note"; s.textContent = ""; s.style.display = "none"; }
    });
}
$("ph").addEventListener("blur", function(){ clearTimeout(phTimer); checkPhone(); });
$("ph").addEventListener("input", function(){
  clearTimeout(phTimer);
  var p = ($("ph").value || "").replace(/\D/g,"");
  if(p.length < 10){ checkPhone(); return; }
  $("phs").className = "note ld"; $("phs").textContent = t("rsearch"); $("phs").style.display = "block";
  phTimer = setTimeout(checkPhone, 450);
});


/* =========================================================
   Returning customer — load by last 4 of profile + last 3 of phone
   Sheet is expected to accept: ?ref=XXXX&phone=YYY  (or ?order=)
   ========================================================= */
$("rgo").onclick = function(){
  var ref = ($("rref").value || "").replace(/\D/g,"");
  var last3 = ($("rl4").value || "").replace(/\D/g,"");
  var st = $("rstatus");
  if(ref.length < 4 || last3.length < 3){
    st.style.display = "block";
    st.className = "note";
    st.textContent = t("rneed");
    return;
  }
  if(!sheetOn()){
    st.style.display = "block";
    st.className = "note";
    st.textContent = t("rerr");
    return;
  }
  st.style.display = "block";
  st.className = "note ld";
  st.textContent = t("rload");
  $("rgo").disabled = true;
  var url = SHEET_URL
    + "?ref=" + encodeURIComponent(ref)
    + "&phone=" + encodeURIComponent(last3)
    + "&order=" + encodeURIComponent(ref);
  var ctl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ if(ctl) ctl.abort(); }, 12000);
  fetch(url, { signal: ctl ? ctl.signal : undefined })
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(to);
      $("rgo").disabled = false;
      if(j && j.ok && j.found){
        applyProfile(j);
        showKnown(st, j.name || "", profileNo);
        /* also fill phone field if returned */
        if(j.phone && !$("ph").value) $("ph").value = j.phone;
        if(j.email && !$("em").value) $("em").value = j.email;
      } else if(j && j.error === "locked"){
        st.className = "note";
        st.textContent = t("rlock");
      } else {
        st.className = "note";
        st.textContent = t("rnf");
      }
    })
    .catch(function(){
      clearTimeout(to);
      $("rgo").disabled = false;
      st.className = "note";
      st.textContent = t("rerr");
    });
};
